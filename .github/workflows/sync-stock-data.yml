name: Sync stock data

on:
  schedule:
    # 09:00-15:00 Vietnam time (UTC+7), Monday-Friday.
    - cron: "*/30 2-8 * * 1-5"
  workflow_dispatch:

jobs:
  sync-stock-data:
    runs-on: ubuntu-latest
    steps:
      - name: Call production sync endpoint
        run: |
          curl -fsS -X GET "https://stock-analyzer-sigma-one.vercel.app/api/cron/sync-prices" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
