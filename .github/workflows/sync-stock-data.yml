name: Sync stock data

on:
  schedule:
    # 09:00-15:00 Vietnam time (UTC+7), Monday-Friday.
    - cron: "*/15 2-8 * * 1-5"
  workflow_dispatch:

jobs:
  sync-stock-data:
    runs-on: ubuntu-latest
    steps:
      - name: Sync batch 0
        run: |
          curl -fsS -X GET "https://stock-analyzer-sigma-one.vercel.app/api/cron/sync-prices?batch=0&limit=100" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Sync batch 1
        run: |
          curl -fsS -X GET "https://stock-analyzer-sigma-one.vercel.app/api/cron/sync-prices?batch=1&limit=100" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Sync batch 2
        run: |
          curl -fsS -X GET "https://stock-analyzer-sigma-one.vercel.app/api/cron/sync-prices?batch=2&limit=100" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
