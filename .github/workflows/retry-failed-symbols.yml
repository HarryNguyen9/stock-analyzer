name: Retry failed symbols

on:
  workflow_dispatch:
  schedule:
    # Chạy mỗi 30 phút trong giờ giao dịch VN, thứ 2-6
    # UTC 02:00-08:00 = VN 09:00-15:00
    - cron: "*/30 2-8 * * 1-5"

jobs:
  retry-failed-symbols:
    runs-on: ubuntu-latest

    steps:
      - name: Retry failed symbols
        run: |
          curl -fsS -X GET "https://stock-analyzer-sigma-one.vercel.app/api/cron/retry-failed-symbols?limit=20" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
